[package]
name = "atvideo-service"
version = "0.1.0-alpha.0"
edition = "2021"

[lib]
name = "atvideo_service"
path = "src/lib.rs"

[dependencies]
fs2 = "0.4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls", "gzip", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

